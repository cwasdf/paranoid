<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PARANOID Table Editor</title>

  <!-- Bootstrap (CSS only; keep styling minimal) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- CodeMirror 5 (no theme) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.css">

  <style>
    html, body { height: 100%; }
    body { margin: 0; font-size: 13px; }

    #app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #topPane {
      flex: 1 1 50%;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    #tableWrap {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
    }

    /* Table: single-line cells, vertical centering, 10px left/right padding */
    table {
      table-layout: fixed;
      width: 100%;
      margin-bottom: 0;
    }
    th, td {
      font-size: 13px;
      padding: 0 10px;
      vertical-align: middle;
      line-height: 28px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    tr { height: 28px; }

    td.cell-num { text-align: right; }
    td.cell-code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }

    /* Minimal selection affordance (no theme/colors; very light neutral) */
    tr.row-selected > td { background: rgba(0,0,0,0.03); }
    .cell-active { box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5); }

    /* Metadata child rows */
    tr.meta-row > td {
      padding: 0;
      line-height: normal;
    }
    .meta-table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
    }
    .meta-table td {
      padding: 0 10px;
      vertical-align: middle;
      line-height: 28px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border: 0;
    }
    .meta-table td + td { border-left: 1px solid var(--bs-border-color); }

    #controlBar {
      flex: 0 0 auto;
      border-top: 1px solid var(--bs-border-color);
      padding: 2px 6px;
      overflow-x: auto;
      white-space: nowrap;
    }
    #controlBar .rowline {
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: 12px;
    }
    #controlBar label {
      font-size: 13px;
      margin: 0 4px 0 0;
    }
    #controlBar input,
    #controlBar select,
    #controlBar button {
      font-size: 13px;
      height: 28px;
      padding: 2px 6px;
      line-height: 24px;
    }
    #controlBar .btn { padding: 2px 10px; }

    #editorPane {
      flex: 1 1 50%;
      min-height: 0;
    }
    #editor {
      height: 100%;
      width: 100%;
    }
    .CodeMirror {
      height: 100%;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="topPane">
      <div id="tableWrap">
        <table id="mainTable" class="table table-bordered">
          <colgroup>
            <col style="width: 52px;">
            <col>
            <col style="width: 150px;">
            <col style="width: 150px;">
          </colgroup>
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">Code</th>
              <th scope="col">Option A</th>
              <th scope="col">Option B</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <!-- Single-line control row (between table and editor) -->
      <div id="controlBar">
        <div class="rowline">
          <div class="d-flex align-items-center">
            <label for="optA">Option A</label>
            <select id="optA" class="form-select form-select-sm"></select>
          </div>

          <div class="d-flex align-items-center">
            <label for="optB">Option B</label>
            <select id="optB" class="form-select form-select-sm"></select>
          </div>

          <div class="d-flex align-items-center">
            <label for="metaKey">Meta key</label>
            <input id="metaKey" class="form-control form-control-sm" type="text" autocomplete="off" />
          </div>

          <div class="d-flex align-items-center">
            <label for="metaVal">Meta val</label>
            <input id="metaVal" class="form-control form-control-sm" type="text" autocomplete="off" />
          </div>

          <button id="addMeta" class="btn btn-outline-secondary btn-sm" type="button">Add meta</button>
          <button id="saveRow" class="btn btn-primary btn-sm" type="button">Save</button>
        </div>
      </div>
    </div>

    <div id="editorPane">
      <textarea id="editor"></textarea>
    </div>
  </div>

  <!-- CodeMirror 5 -->
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.min.js"></script>

  <script>
    const STORAGE_KEY = "paranoid_table_editor_v1";

    const OPTIONS_A = ["", "alpha", "beta", "gamma"];
    const OPTIONS_B = ["", "dev", "stage", "prod"];

    const state = {
      rows: [],
      selectedRowId: null,
      activeEditorTarget: null, // { kind: "main"|"meta", rowId, field: "code"|"key"|"value", metaIndex?: number }
    };

    let editor = null;
    let programmaticEditorSet = false;
    let persistTimer = null;

    function loadFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return false;
        const obj = JSON.parse(raw);
        if (!obj || typeof obj !== "object") return false;
        if (!Array.isArray(obj.rows)) return false;
        state.rows = obj.rows.map(r => ({
          id: Number(r.id),
          code: String(r.code ?? ""),
          optA: String(r.optA ?? ""),
          optB: String(r.optB ?? ""),
          meta: Array.isArray(r.meta) ? r.meta.map(m => ({ key: String(m.key ?? ""), value: String(m.value ?? "") })) : [],
        })).filter(r => Number.isFinite(r.id));
        state.selectedRowId = Number.isFinite(Number(obj.selectedRowId)) ? Number(obj.selectedRowId) : null;
        state.activeEditorTarget = obj.activeEditorTarget ?? null;
        return true;
      } catch {
        return false;
      }
    }

    function saveToStorageDebounced() {
      clearTimeout(persistTimer);
      persistTimer = setTimeout(() => {
        const payload = {
          rows: state.rows,
          selectedRowId: state.selectedRowId,
          activeEditorTarget: state.activeEditorTarget,
        };
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); } catch {}
      }, 250);
    }

    function ensureDefaultRows() {
      if (state.rows.length > 0) return;
      for (let i = 1; i <= 8; i++) {
        state.rows.push({ id: i, code: "", optA: "", optB: "", meta: [] });
      }
    }

    function displayOneLine(s) {
      return String(s ?? "")
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n")
        .replace(/\n/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function getRow(rowId) {
      return state.rows.find(r => r.id === rowId) || null;
    }

    function getValueForTarget(t) {
      if (!t) return "";
      if (t.kind === "main") {
        const row = getRow(t.rowId);
        if (!row) return "";
        return row.code || "";
      }
      if (t.kind === "meta") {
        const row = getRow(t.rowId);
        const m = row?.meta?.[t.metaIndex];
        if (!m) return "";
        return (t.field === "key" ? m.key : m.value) || "";
      }
      return "";
    }

    function setValueForTarget(t, val) {
      if (!t) return;
      if (t.kind === "main") {
        const row = getRow(t.rowId);
        if (!row) return;
        row.code = String(val ?? "");
        updateMainCellDisplay(row.id);
        return;
      }
      if (t.kind === "meta") {
        const row = getRow(t.rowId);
        const m = row?.meta?.[t.metaIndex];
        if (!m) return;
        if (t.field === "key") m.key = String(val ?? "");
        else m.value = String(val ?? "");
        updateMetaCellDisplay(row.id, t.metaIndex);
      }
    }

    function updateMainCellDisplay(rowId) {
      const row = getRow(rowId);
      if (!row) return;
      const td = document.querySelector(`td.cell-code[data-row-id="${rowId}"]`);
      if (!td) return;
      td.textContent = displayOneLine(row.code);
    }

    function updateMetaCellDisplay(rowId, metaIndex) {
      const row = getRow(rowId);
      if (!row) return;
      const m = row.meta[metaIndex];
      if (!m) return;
      const keyEl = document.querySelector(`td.meta-cell[data-row-id="${rowId}"][data-meta-index="${metaIndex}"][data-field="key"]`);
      const valEl = document.querySelector(`td.meta-cell[data-row-id="${rowId}"][data-meta-index="${metaIndex}"][data-field="value"]`);
      if (keyEl) keyEl.textContent = displayOneLine(m.key);
      if (valEl) valEl.textContent = displayOneLine(m.value);
    }

    function setSelectedRow(rowId) {
      state.selectedRowId = rowId;
      const row = getRow(rowId);
      if (!row) {
        return;
      }
      document.getElementById("optA").value = row.optA || "";
      document.getElementById("optB").value = row.optB || "";
      saveToStorageDebounced();
      renderSelectionOnly();
    }

    function setActiveEditorTarget(t) {
      state.activeEditorTarget = t;
      const val = getValueForTarget(t);
      programmaticEditorSet = true;
      editor.setValue(val);
      editor.focus();
      editor.setCursor(editor.lineCount(), 0);
      programmaticEditorSet = false;
      saveToStorageDebounced();
      renderSelectionOnly();
    }

    function clearActiveCellHighlights() {
      document.querySelectorAll(".cell-active").forEach(el => el.classList.remove("cell-active"));
    }

    function renderSelectionOnly() {
      // Row highlight
      document.querySelectorAll("tr.main-row").forEach(tr => {
        const rid = Number(tr.dataset.rowId);
        if (rid === state.selectedRowId) tr.classList.add("row-selected");
        else tr.classList.remove("row-selected");
      });

      clearActiveCellHighlights();
      const t = state.activeEditorTarget;
      if (!t) return;
      if (t.kind === "main") {
        const td = document.querySelector(`td.cell-code[data-row-id="${t.rowId}"]`);
        if (td) td.classList.add("cell-active");
      } else if (t.kind === "meta") {
        const td = document.querySelector(`td.meta-cell[data-row-id="${t.rowId}"][data-meta-index="${t.metaIndex}"][data-field="${t.field}"]`);
        if (td) td.classList.add("cell-active");
      }
    }

    function renderOptions() {
      const optA = document.getElementById("optA");
      const optB = document.getElementById("optB");
      optA.innerHTML = "";
      optB.innerHTML = "";
      for (const v of OPTIONS_A) {
        const o = document.createElement("option");
        o.value = v;
        o.textContent = v === "" ? "(none)" : v;
        optA.appendChild(o);
      }
      for (const v of OPTIONS_B) {
        const o = document.createElement("option");
        o.value = v;
        o.textContent = v === "" ? "(none)" : v;
        optB.appendChild(o);
      }
    }

    function renderTable() {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      for (let i = 0; i < state.rows.length; i++) {
        const row = state.rows[i];

        const tr = document.createElement("tr");
        tr.className = "main-row";
        tr.dataset.rowId = String(row.id);

        const tdNum = document.createElement("td");
        tdNum.className = "cell-num";
        tdNum.textContent = String(i + 1);
        tr.appendChild(tdNum);

        const tdCode = document.createElement("td");
        tdCode.className = "cell-code";
        tdCode.dataset.cell = "code";
        tdCode.dataset.rowId = String(row.id);
        tdCode.textContent = displayOneLine(row.code);
        tr.appendChild(tdCode);

        const tdA = document.createElement("td");
        tdA.dataset.cell = "optA";
        tdA.textContent = displayOneLine(row.optA);
        tr.appendChild(tdA);

        const tdB = document.createElement("td");
        tdB.dataset.cell = "optB";
        tdB.textContent = displayOneLine(row.optB);
        tr.appendChild(tdB);

        tbody.appendChild(tr);

        // Child metadata rows (2 columns)
        for (let mi = 0; mi < (row.meta?.length || 0); mi++) {
          const m = row.meta[mi];
          const mtr = document.createElement("tr");
          mtr.className = "meta-row";
          mtr.dataset.rowId = String(row.id);
          mtr.dataset.metaIndex = String(mi);

          const mtd = document.createElement("td");
          mtd.colSpan = 4;

          const mt = document.createElement("table");
          mt.className = "meta-table";
          const cg = document.createElement("colgroup");
          const c1 = document.createElement("col"); c1.style.width = "30%";
          const c2 = document.createElement("col"); c2.style.width = "70%";
          cg.appendChild(c1); cg.appendChild(c2);
          mt.appendChild(cg);

          const mtb = document.createElement("tbody");
          const mtr2 = document.createElement("tr");

          const mk = document.createElement("td");
          mk.className = "meta-cell";
          mk.dataset.kind = "meta";
          mk.dataset.rowId = String(row.id);
          mk.dataset.metaIndex = String(mi);
          mk.dataset.field = "key";
          mk.textContent = displayOneLine(m.key);

          const mv = document.createElement("td");
          mv.className = "meta-cell";
          mv.dataset.kind = "meta";
          mv.dataset.rowId = String(row.id);
          mv.dataset.metaIndex = String(mi);
          mv.dataset.field = "value";
          mv.textContent = displayOneLine(m.value);

          mtr2.appendChild(mk);
          mtr2.appendChild(mv);
          mtb.appendChild(mtr2);
          mt.appendChild(mtb);

          mtd.appendChild(mt);
          mtr.appendChild(mtd);
          tbody.appendChild(mtr);
        }
      }
    }

    function renderAll() {
      renderOptions();
      renderTable();
      renderSelectionOnly();
    }

    function initEditor() {
      editor = CodeMirror.fromTextArea(document.getElementById("editor"), {
        mode: "javascript",
        lineNumbers: true,
        lineWrapping: false,
        indentUnit: 2,
        tabSize: 2,
      });

      editor.on("change", () => {
        if (programmaticEditorSet) return;
        if (!state.activeEditorTarget) return;
        setValueForTarget(state.activeEditorTarget, editor.getValue());
        saveToStorageDebounced();
      });
    }

    function bindUI() {
      document.getElementById("mainTable").addEventListener("click", (e) => {
        const metaCell = e.target.closest("td.meta-cell");
        if (metaCell) {
          const rowId = Number(metaCell.dataset.rowId);
          const metaIndex = Number(metaCell.dataset.metaIndex);
          const field = metaCell.dataset.field;
          if (Number.isFinite(rowId)) setSelectedRow(rowId);
          setActiveEditorTarget({ kind: "meta", rowId, metaIndex, field });
          return;
        }

        const tr = e.target.closest("tr.main-row");
        if (!tr) return;
        const rowId = Number(tr.dataset.rowId);
        if (!Number.isFinite(rowId)) return;
        setSelectedRow(rowId);

        const td = e.target.closest("td[data-cell]");
        if (td && td.dataset.cell === "code") {
          setActiveEditorTarget({ kind: "main", rowId, field: "code" });
        }
      });

      document.getElementById("saveRow").addEventListener("click", () => {
        const rowId = state.selectedRowId;
        const row = rowId ? getRow(rowId) : null;
        if (!row) return;
        row.optA = document.getElementById("optA").value;
        row.optB = document.getElementById("optB").value;
        // Update table cells without full re-render
        const tr = document.querySelector(`tr.main-row[data-row-id="${rowId}"]`);
        if (tr) {
          const tda = tr.querySelector('td[data-cell="optA"]');
          const tdb = tr.querySelector('td[data-cell="optB"]');
          if (tda) tda.textContent = displayOneLine(row.optA);
          if (tdb) tdb.textContent = displayOneLine(row.optB);
        }
        saveToStorageDebounced();
      });

      document.getElementById("addMeta").addEventListener("click", () => {
        const rowId = state.selectedRowId;
        const row = rowId ? getRow(rowId) : null;
        if (!row) return;
        const key = document.getElementById("metaKey").value.trim();
        const val = document.getElementById("metaVal").value.trim();
        if (!key && !val) return;
        row.meta = row.meta || [];
        row.meta.push({ key, value: val });
        document.getElementById("metaKey").value = "";
        document.getElementById("metaVal").value = "";
        saveToStorageDebounced();
        renderAll();
        // Focus editor on the new metadata value cell by default
        setActiveEditorTarget({ kind: "meta", rowId, metaIndex: row.meta.length - 1, field: "value" });
      });
    }

    (function main() {
      loadFromStorage();
      ensureDefaultRows();
      initEditor();
      bindUI();
      renderAll();

      // Restore selection/active editor target if present
      if (state.selectedRowId && getRow(state.selectedRowId)) {
        setSelectedRow(state.selectedRowId);
      }
      if (state.activeEditorTarget) {
        const t = state.activeEditorTarget;
        if (t.kind === "main" && getRow(t.rowId)) setActiveEditorTarget(t);
        if (t.kind === "meta" && getRow(t.rowId)?.meta?.[t.metaIndex]) setActiveEditorTarget(t);
      }
    })();
  </script>
</body>
</html>
